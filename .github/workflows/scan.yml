name: Daily Stock Scan

on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリインストール
        run: pip install pandas numpy yfinance pytz matplotlib japanize-matplotlib

      - name: スキャン実行 & チャート生成
        run: python scan.py

      - name: 結果をリポジトリへ反映
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json charts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: watchlist & charts [skip ci]" && git push)
