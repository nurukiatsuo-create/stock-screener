name: Daily Stock Scan

on:
  schedule:
    # 平日 JST 07:00 (UTC 日〜木 22:00) に自動起動
    - cron: '0 22 * * 0-4'
  workflow_dispatch: # GitHub上のボタンから手動実行を許可

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリインストール
        run: pip install pandas numpy yfinance pytz

      - name: スキャン実行
        run: python scan.py

      - name: 結果(watchlist.json)をリポジトリへ反映
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: watchlist.json [skip ci]" && git push)
